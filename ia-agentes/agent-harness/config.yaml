# Registro global de agentes — inventario, no motor de permisos.
#
# Esto NO reemplaza el modelo de permisos real de Claude Code (eso vive en
# .claude/settings.json del proyecto que consuma estos agentes: allow/deny
# por tool). Es solo un índice legible de qué agentes existen, en qué runner
# están disponibles hoy, y una nota de qué tools declara cada uno — útil para
# ver el catálogo completo de un vistazo sin abrir 6 carpetas.

agents:
  - name: hexagonal-architect
    domain: desarrollo-software
    runners: [claude_code]
    tools: [Read, Write, Edit, Bash, Grep, Glob]

  - name: java-21-dev
    domain: desarrollo-software
    runners: [claude_code]
    tools: [Read, Write, Edit, Bash, Grep, Glob]
    nota: Java 21 puro, agnóstico de framework (antes parte de java-reactive-dev, dividido para separar lenguaje de framework)

  - name: spring-boot-webflux-dev
    domain: desarrollo-software
    runners: [claude_code]
    tools: [Read, Write, Edit, Bash, Grep, Glob]
    nota: Spring Boot + WebFlux + Reactor (antes parte de java-reactive-dev, dividido para separar lenguaje de framework)

  - name: tdd-reviewer
    domain: desarrollo-software
    runners: [claude_code]
    tools: [Read, Write, Edit, Bash, Grep, Glob]

  - name: gitflow-release-manager
    domain: desarrollo-software
    runners: [claude_code]
    tools: [Read, Bash, Grep, Glob]
    nota: nunca ejecuta push/merge/PR sin confirmación humana explícita — ver instructions.md

  - name: owasp-security-reviewer
    domain: desarrollo-software
    runners: [claude_code]
    tools: [Read, Grep, Glob, Bash]

  - name: clean-code-reviewer
    domain: desarrollo-software
    runners: [claude_code]
    tools: [Read, Grep, Glob, Bash]

# Runners disponibles y su estado real (ver runners/<nombre>/README.md de cada uno)
runners:
  claude_code:
    estado: implementado
    entry_point: runners/claude_code/compile.py
  sdk_runner:
    estado: no_implementado
    motivo: sin caso de uso real todavía (YAGNI) — ver runners/sdk_runner/README.md
